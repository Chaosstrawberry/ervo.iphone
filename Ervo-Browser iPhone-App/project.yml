# Optional: regenerate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && cd ios && xcodegen generate
# The checked-in ErvoBrowser.xcodeproj works without this.
name: ErvoBrowser
options:
  bundleIdPrefix: com.ervobrowser
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  ErvoBrowser:
    type: application
    platform: iOS
    sources:
      - path: ErvoBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ervobrowser.ios
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
